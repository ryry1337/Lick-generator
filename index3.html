<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FretMind: Ear & Geometry Trainer</title>
    <style>
        :root {
            --fret-color: #2c2c2c;
            --wood-color: #1a1a1a;
            --string-color: #666;
            --highlight: #00d4ff; /* Cyan for Root */
            --target: #ff0055; /* Red/Pink for Target */
            --success: #00ff88;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #0d0d0d;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        header {
            text-align: center;
            padding: 20px;
            background: #111;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }

        h1 { margin: 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #888; font-size: 0.9rem; margin-top: 5px; }

        #controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        #btn-play { background: var(--highlight); color: black; }
        #btn-hear { background: #333; color: white; border: 1px solid #555; }

        /* THE FRETBOARD */
        #fretboard-container {
            flex-grow: 1;
            width: 100%;
            overflow-x: auto; /* Scrollable for mobile */
            display: flex;
            align-items: center;
            padding: 20px 0;
            background: #0a0a0a;
        }

        #neck {
            display: grid;
            grid-template-rows: repeat(6, 40px); /* 6 Strings */
            background: var(--wood-color);
            border-top: 5px solid #333;
            border-bottom: 5px solid #333;
            position: relative;
            margin-left: 20px; /* Nut spacing */
        }

        .string-row {
            display: flex;
            position: relative;
        }

        /* The physical string line */
        .string-line {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--string-color);
            z-index: 0;
            pointer-events: none;
        }
        /* Thicker low strings */
        .string-row:nth-child(4) .string-line { height: 3px; }
        .string-row:nth-child(5) .string-line { height: 4px; }
        .string-row:nth-child(6) .string-line { height: 5px; }

        .fret {
            width: 60px; /* Distance between frets */
            height: 40px;
            border-right: 4px solid silver; /* Fret wire */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1;
        }

        .fret:hover { background: rgba(255,255,255,0.05); }
        
        /* Fret Markers (Dots) */
        .marker {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            color: #444;
            font-size: 0.8rem;
            pointer-events: none;
        }

        /* Note Indicators */
        .note-circle {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
        }

        .note-circle.root {
            background-color: var(--highlight);
            color: black;
            opacity: 1;
            box-shadow: 0 0 10px var(--highlight);
        }

        .note-circle.clicked {
            opacity: 1;
            transform: scale(1.2);
        }

        .note-circle.correct { background-color: var(--success); color: black; }
        .note-circle.wrong { background-color: var(--target); color: white; }

        #status-bar {
            padding: 15px;
            background: #111;
            width: 100%;
            text-align: center;
            font-weight: bold;
            color: var(--highlight);
        }

    </style>
</head>
<body>

    <header>
        <h1>FretMind Alpha</h1>
        <p>Hear the tone. Find the geometry.</p>
        <div id="controls">
            <button id="btn-play" onclick="startGame()">New Round</button>
            <button id="btn-hear" onclick="replaySound()">Replay Sound</button>
        </div>
    </header>

    <div id="fretboard-container">
        <div id="neck">
            </div>
    </div>

    <div id="status-bar">Press "New Round" to start</div>

    <script>
        // --- CONFIGURATION ---
        const numFrets = 15;
        // MIDI Notes for Open Strings (High E to Low E)
        const openStrings = [64, 59, 55, 50, 45, 40]; 
        let audioCtx = null;
        
        // Game State
        let currentRoot = null; // {string, fret, midi}
        let currentTargetMidi = null;
        let isRoundActive = false;

        // --- AUDIO ENGINE (Web Audio API) ---
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function midiToFreq(midi) {
            return 440 * Math.pow(2, (midi - 69) / 12);
        }

        function playTone(midi, type = 'sine', duration = 1, time = 0) {
            if (!audioCtx) initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = type;
            osc.frequency.value = midiToFreq(midi);
            
            // Envelope to make it sound plucky (like a guitar)
            gain.gain.setValueAtTime(0, audioCtx.currentTime + time);
            gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + time + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + time + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(audioCtx.currentTime + time);
            osc.stop(audioCtx.currentTime + time + duration);
        }

        // --- FRETBOARD GENERATION ---
        const neck = document.getElementById('neck');

        function renderFretboard() {
            neck.innerHTML = '';
            
            // Loop through 6 strings
            openStrings.forEach((openNote, stringIndex) => {
                const row = document.createElement('div');
                row.className = 'string-row';
                
                // The physical line
                const line = document.createElement('div');
                line.className = 'string-line';
                row.appendChild(line);

                // Loop through frets
                for (let f = 0; f <= numFrets; f++) {
                    const fretDiv = document.createElement('div');
                    fretDiv.className = 'fret';
                    fretDiv.dataset.string = stringIndex;
                    fretDiv.dataset.fret = f;
                    fretDiv.dataset.midi = openNote + f;
                    
                    // Note Circle (Hidden by default)
                    const circle = document.createElement('div');
                    circle.className = 'note-circle';
                    fretDiv.appendChild(circle);

                    // Fret Markers (3, 5, 7, 9, 12)
                    if (stringIndex === 5) { // Only add markers below bottom string
                        if ([3, 5, 7, 9, 12, 15].includes(f)) {
                            const marker = document.createElement('div');
                            marker.className = 'marker';
                            marker.innerText = f;
                            fretDiv.appendChild(marker);
                        }
                    }

                    // Interaction
                    fretDiv.addEventListener('click', () => handleFretClick(fretDiv));
                    row.appendChild(fretDiv);
                }
                neck.appendChild(row);
            });
        }

        // --- GAME LOGIC ---

        function startGame() {
            initAudio();
            clearBoard();
            
            // 1. Pick a random Root Note (Between fret 2 and 8 for centering)
            const randString = Math.floor(Math.random() * 6);
            const randFret = Math.floor(Math.random() * 7) + 2;
            const rootMidi = openStrings[randString] + randFret;

            currentRoot = { string: randString, fret: randFret, midi: rootMidi };

            // 2. Pick a Target Interval (Simple: Major 3rd, Perfect 4th, Perfect 5th)
            const intervals = [4, 5, 7]; // Semitones
            const interval = intervals[Math.floor(Math.random() * intervals.length)];
            currentTargetMidi = rootMidi + interval;

            // 3. Visualize Root
            highlightRoot(randString, randFret);

            // 4. Play Audio Sequence
            document.getElementById('status-bar').innerText = "Listen... Find the second note.";
            playChallenge();
            
            isRoundActive = true;
        }

        function playChallenge() {
            if(!currentRoot) return;
            // Play Root
            playTone(currentRoot.midi, 'triangle', 1, 0);
            // Play Target (after delay)
            playTone(currentTargetMidi, 'sine', 1.5, 0.8);
        }

        function replaySound() {
            playChallenge();
        }

        function highlightRoot(s, f) {
            // Select the specific DOM element
            const rows = document.querySelectorAll('.string-row');
            const frets = rows[s].querySelectorAll('.fret');
            const circle = frets[f].querySelector('.note-circle');
            
            circle.classList.add('root');
            circle.innerText = "R";
        }

        function clearBoard() {
            document.querySelectorAll('.note-circle').forEach(el => {
                el.className = 'note-circle';
                el.innerText = '';
            });
        }

        function handleFretClick(fretDiv) {
            if (!isRoundActive) return;

            const clickedMidi = parseInt(fretDiv.dataset.midi);
            const circle = fretDiv.querySelector('.note-circle');
            
            circle.classList.add('clicked');
            playTone(clickedMidi, 'triangle', 0.5);

            if (clickedMidi === currentTargetMidi) {
                // Correct
                circle.classList.add('correct');
                circle.innerText = "✓";
                document.getElementById('status-bar').innerText = "Correct! Good Ear.";
                document.getElementById('status-bar').style.color = "#00ff88";
                isRoundActive = false;
            } else {
                // Wrong
                circle.classList.add('wrong');
                circle.innerText = "X";
                document.getElementById('status-bar').innerText = "Try again. Listen close.";
                document.getElementById('status-bar').style.color = "#ff0055";
            }
        }

        // Initialize visual board on load
        renderFretboard();

    </script>
</body>
</html>
