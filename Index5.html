<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lick Generator: Composition Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root {
            --bg-color: #090a0f;
            --surface-color: #14161f;
            --primary-color: #9d4edd;
            --secondary-color: #3c096c;
            --text-color: #e0aaff;
            --text-muted: #7b2cbf;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin: 10px 0 0 0; font-size: 1.5rem; color: var(--primary-color); text-align: center;}
        .subtitle { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 15px; }

        .dashboard {
            background-color: var(--surface-color);
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            box-sizing: border-box;
            border: 1px solid var(--secondary-color);
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary-color);
            margin: 15px 0 8px 0;
            border-bottom: 1px solid var(--secondary-color);
            padding-bottom: 4px;
        }
        .section-title:first-child { margin-top: 0; }

        .control-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: #d8b4e2;
        }

        select, input[type="range"] {
            background: var(--bg-color);
            color: white;
            border: 1px solid var(--secondary-color);
            padding: 6px;
            border-radius: 4px;
            font-size: 0.85rem;
            max-width: 55%;
        }

        select { width: 55%; }
        input[type="range"] { width: 50%; accent-color: var(--primary-color); }

        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--secondary-color); transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: var(--text-color); transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(22px); background-color: #fff;}

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--secondary-color);
            padding: 12px 8px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        button.primary { background: var(--primary-color); color: #000; border: none; font-size: 1.1rem; padding: 14px; }
        button.action { border-color: var(--primary-color); color: var(--primary-color); }
        button:active { transform: scale(0.96); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #reveal-area {
            margin-top: 15px;
            background: #000;
            border: 1px solid var(--secondary-color);
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            overflow-x: auto;
        }
        
        .reveal-hint { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;}
        .reveal-content { font-size: 1.1rem; color: var(--primary-color); font-weight: bold; min-height: 30px;}
        .active-params { font-size: 0.7rem; color: #aaa; margin-top: 10px; border-top: 1px dashed #333; padding-top: 5px;}
        
        pre { font-family: 'Courier New', monospace; text-align: left; margin: 0; font-size: 0.85rem; color: var(--text-color); line-height: 1.2; }
    </style>
</head>
<body>

    <h1>Composition Engine</h1>
    <div class="subtitle">Smart Phrasing & Infinite Variety</div>

    <div class="dashboard">
        
        <!-- TONAL CENTER -->
        <div class="section-title">Tonal Center</div>
        <div class="control-group">
            <label>Key</label>
            <select id="key-select">
                <option value="random">🎲 Random Key</option>
                <option value="C">C</option><option value="G">G</option>
                <option value="D">D</option><option value="A" selected>A</option>
                <option value="E">E</option><option value="B">B</option>
                <option value="F">F</option><option value="Bb">Bb</option>
            </select>
        </div>
        <div class="control-group">
            <label>Scale</label>
            <select id="scale-select">
                <option value="random">🎲 Random Scale</option>
                <option value="minPent">Minor Pentatonic</option>
                <option value="majPent">Major Pentatonic</option>
                <option value="blues">Blues Scale</option>
                <option value="dorian">Dorian</option>
                <option value="mixolydian">Mixolydian</option>
                <option value="natMinor">Natural Minor</option>
                <option value="major">Major (Ionian)</option>
                <option value="harmMinor">Harmonic Minor</option>
                <option value="phrygDom">Phrygian Dominant</option>
            </select>
        </div>
        <div class="control-group">
            <label>Register</label>
            <select id="register-select">
                <option value="random">🎲 Random</option>
                <option value="low">Low (Riffs/Rhythm)</option>
                <option value="mid" selected>Mid (Standard Lead)</option>
                <option value="high">High (Soaring Solo)</option>
            </select>
        </div>

        <!-- SHAPE & PHRASING -->
        <div class="section-title">Shape & Phrasing</div>
        <div class="control-group">
            <label>Contour</label>
            <select id="contour-select">
                <option value="random">🎲 Random</option>
                <option value="walk">Wandering Walk</option>
                <option value="ascending">Ascending</option>
                <option value="descending">Descending</option>
                <option value="arch">Arch (Up then Down)</option>
            </select>
        </div>
        <div class="control-group">
            <label>Allow Repeats</label>
            <label class="switch">
                <input type="checkbox" id="repeat-toggle">
                <span class="slider"></span>
            </label>
        </div>
        <div class="control-group">
            <label>Arpeggio Bias: <span id="arp-display">20%</span></label>
            <input type="range" id="arp-slider" min="0" max="100" step="10" value="20">
        </div>
        <div class="control-group">
            <label>Length (Notes): <span id="diff-display">6</span></label>
            <input type="range" id="diff-slider" min="3" max="16" value="6">
        </div>

        <!-- FEEL & PLAYBACK -->
        <div class="section-title">Feel & Composition</div>
        <div class="control-group">
            <label>Genre Profile</label>
            <select id="genre-select">
                <option value="random">🎲 Random</option>
                <option value="rock" selected>Rock (Straight / Leaps)</option>
                <option value="blues">Blues (Triplets / Tight)</option>
                <option value="jazz">Jazz (Swung / Arpeggios)</option>
                <option value="metal">Metal (16ths / Pedal Point)</option>
            </select>
        </div>
        <div class="control-group">
            <label>Backing Track</label>
            <select id="backing-select">
                <option value="random">🎲 Random</option>
                <option value="drone">Static Bass Drone</option>
                <option value="blues">I - IV - V Progression</option>
                <option value="none" selected>None</option>
            </select>
        </div>
        <div class="control-group">
            <label>Speed: <span id="speed-display">100%</span></label>
            <input type="range" id="speed-slider" min="50" max="150" step="5" value="100">
        </div>

        <!-- CONTROLS -->
        <div class="btn-grid">
            <button id="generate-btn" class="primary" style="grid-column: span 2;">Generate & Play</button>
            <button id="replay-btn">Replay Audio</button>
            <button id="reveal-btn" class="action">Reveal Notes</button>
        </div>
        
        <div id="reveal-area">
            <div class="reveal-hint" id="reveal-hint">Status</div>
            <div class="reveal-content" id="reveal-text">Ready</div>
            <div class="active-params" id="active-params-text"></div>
        </div>
    </div>

    <script>
        // --- SYNTH SETUP ---
        const synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "triangle" },
            envelope: { attack: 0.01, decay: 0.3, sustain: 0.1, release: 0.8 }
        }).toDestination();
        
        const padSynth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sine" },
            envelope: { attack: 0.5, decay: 0.5, sustain: 0.5, release: 2 }
        }).toDestination();
        padSynth.volume.value = -18; 

        // --- 3-OCTAVE SCALE GENERATOR ---
        function createScale(intervals, names, arpIndices, octaves = 3) {
            let resInt = [], resNames = [], resArp = [];
            for (let o = 0; o < octaves; o++) {
                for (let i = 0; i < intervals.length; i++) {
                    resInt.push(intervals[i] + (o * 12));
                    resNames.push(names[i]);
                    if (arpIndices.includes(i)) resArp.push(resInt.length - 1);
                }
            }
            resInt.push(octaves * 12); resNames.push("8");
            if (arpIndices.includes(0)) resArp.push(resInt.length - 1);
            return { intervals: resInt, names: resNames, arpIndices: resArp };
        }

        const scales = {
            minPent:    createScale([0,3,5,7,10], ["1","b3","4","5","b7"], [0,1,3]),
            majPent:    createScale([0,2,4,7,9], ["1","2","3","5","6"], [0,2,3]),
            blues:      createScale([0,3,5,6,7,10], ["1","b3","4","b5","5","b7"], [0,1,4]),
            dorian:     createScale([0,2,3,5,7,9,10], ["1","2","b3","4","5","6","b7"], [0,2,4,6]),
            mixolydian: createScale([0,2,4,5,7,9,10], ["1","2","3","4","5","6","b7"], [0,2,4,6]),
            natMinor:   createScale([0,2,3,5,7,8,10], ["1","2","b3","4","5","b6","b7"], [0,2,4,6]),
            major:      createScale([0,2,4,5,7,9,11], ["1","2","3","4","5","6","7"], [0,2,4,6]),
            harmMinor:  createScale([0,2,3,5,7,8,11], ["1","2","b3","4","5","b6","7"], [0,2,4,6]),
            phrygDom:   createScale([0,1,4,5,7,8,10], ["1","b2","3","4","5","b6","b7"], [0,2,4,6])
        };

        let currentLick = []; 
        let isPlaying = false; let revealStage = 0;
        let activeBPM = 100;

        // --- DOM ELEMENTS & LISTENERS ---
        const ui = {
            key: document.getElementById('key-select'), scale: document.getElementById('scale-select'),
            register: document.getElementById('register-select'), contour: document.getElementById('contour-select'),
            repeats: document.getElementById('repeat-toggle'), arp: document.getElementById('arp-slider'),
            diff: document.getElementById('diff-slider'), genre: document.getElementById('genre-select'),
            backing: document.getElementById('backing-select'), speed: document.getElementById('speed-slider'),
            arpDisp: document.getElementById('arp-display'), diffDisp: document.getElementById('diff-display'),
            speedDisp: document.getElementById('speed-display'), generate: document.getElementById('generate-btn'),
            replay: document.getElementById('replay-btn'), revealBtn: document.getElementById('reveal-btn'),
            revealText: document.getElementById('reveal-text'), revealHint: document.getElementById('reveal-hint'),
            activeParams: document.getElementById('active-params-text')
        };

        ui.diff.addEventListener('input', e => ui.diffDisp.textContent = e.target.value);
        ui.arp.addEventListener('input', e => ui.arpDisp.textContent = e.target.value + '%');
        ui.speed.addEventListener('input', e => ui.speedDisp.textContent = e.target.value + '%');

        // Helper to resolve "Random" selections
        function resolveParam(selectElement, optionsArray) {
            if (selectElement.value !== "random") return selectElement.value;
            return optionsArray[Math.floor(Math.random() * optionsArray.length)];
        }

        // --- COMPOSITION ENGINE ---
        function generateLick() {
            currentLick = [];
            
            // Resolve Randoms
            const p = {
                key: resolveParam(ui.key, ["C","G","D","A","E","B","F","Bb"]),
                scale: resolveParam(ui.scale, Object.keys(scales)),
                register: resolveParam(ui.register, ["low","mid","high"]),
                contour: resolveParam(ui.contour, ["walk","ascending","descending","arch"]),
                genre: resolveParam(ui.genre, ["rock","blues","jazz","metal"]),
                backing: resolveParam(ui.backing, ["drone","blues","none"])
            };

            ui.activeParams.innerHTML = `Generated: <b>${p.key} ${p.scale}</b> | <b>${p.genre}</b> style | <b>${p.contour}</b>`;

            const scaleData = scales[p.scale];
            const maxNotes = parseInt(ui.diff.value); 
            let arpProb = parseInt(ui.arp.value) / 100;
            const allowRepeats = ui.repeats.checked;
            
            // Adjust base octave
            let baseOctave = 3;
            if (p.register === "low") baseOctave = 2;
            if (p.register === "high") baseOctave = 4;
            if (["C", "C#", "D", "D#"].includes(p.key) && baseOctave > 1) baseOctave += 1;
            
            const rootFreq = Tone.Frequency(p.key + baseOctave);
            
            // Randomize the starting point heavily to prevent identical licks
            let startingCenter = Math.floor(scaleData.intervals.length / 3);
            let indexVariance = Math.floor(Math.random() * 5) - 2; // -2 to +2 drift
            let currentIndex = startingCenter + indexVariance; 
            
            if (p.contour === "descending") currentIndex = Math.floor((scaleData.intervals.length / 3) * 2) + indexVariance;
            if (p.contour === "ascending") currentIndex = Math.max(0, indexVariance + 1);

            let lastIndex = -1;
            let rootPedalIndex = currentIndex; // Used for metal pedal points

            // GENRE COMPOSITION MODIFIERS
            if (p.genre === "jazz") arpProb += 0.3; // Jazz uses more chord tones

            for (let i = 0; i < maxNotes; i++) {
                // GENRE RHYTHM MODIFIERS
                let duration = "8n"; 
                if (p.genre === "jazz") duration = (i % 2 !== 0) ? "16n" : "8n";
                if (p.genre === "blues") duration = "8t";
                if (p.genre === "metal") duration = "16n";
                if (p.genre === "rock" && Math.random() > 0.7) duration = "16n";
                if (i === maxNotes - 1) duration = "2n"; 

                if (i > 0) {
                    let attempts = 0;
                    let newIndex = currentIndex;
                    
                    while (attempts < 15) { 
                        let isArp = Math.random() < arpProb;
                        
                        // GENRE PHRASING
                        if (p.genre === "metal" && i % 2 !== 0) {
                            // Metal pedal point (returns to a stationary root note often)
                            newIndex = rootPedalIndex;
                        } else {
                            // Standard Contour Logic
                            if (p.contour === "ascending" || (p.contour === "arch" && i < maxNotes/2)) {
                                if (isArp) {
                                    let validArps = scaleData.arpIndices.filter(a => a > currentIndex);
                                    newIndex = validArps.length ? validArps[0] : currentIndex + 1;
                                } else {
                                    newIndex = currentIndex + (Math.random() > 0.4 ? 1 : 2);
                                }
                            } else if (p.contour === "descending" || (p.contour === "arch" && i >= maxNotes/2)) {
                                if (isArp) {
                                    let validArps = scaleData.arpIndices.filter(a => a < currentIndex).reverse();
                                    newIndex = validArps.length ? validArps[0] : currentIndex - 1;
                                } else {
                                    newIndex = currentIndex - (Math.random() > 0.4 ? 1 : 2);
                                }
                            } else {
                                // Wandering Walk
                                if (isArp) {
                                    newIndex = scaleData.arpIndices[Math.floor(Math.random() * scaleData.arpIndices.length)];
                                } else {
                                    // Rock takes bigger leaps, Blues stays tight
                                    let leapSize = (p.genre === "rock" && Math.random() > 0.8) ? 2 : 1;
                                    newIndex += (Math.random() > 0.5 ? 1 : -1) * leapSize;
                                }
                            }
                        }
                        
                        newIndex = Math.max(0, Math.min(newIndex, scaleData.intervals.length - 1));
                        
                        if (allowRepeats || newIndex !== lastIndex) break; 
                        attempts++;
                    }
                    currentIndex = newIndex;
                }

                const midiNote = rootFreq.transpose(scaleData.intervals[currentIndex]).toMidi();
                
                currentLick.push({
                    midi: midiNote,
                    note: Tone.Frequency(midiNote, "midi").toNote(),
                    degree: scaleData.names[currentIndex],
                    dur: duration
                });
                
                lastIndex = currentIndex;
            }
            
            // Set global BPM based on Genre
            if (p.genre === "metal") activeBPM = 120;
            else if (p.genre === "blues") activeBPM = 80;
            else activeBPM = 100;

            // Stash backing track info
            currentLick.backingInfo = { type: p.backing, rootMidi: Tone.Frequency(p.key + "2").toMidi() };
            
            revealStage = 0; updateRevealUI();
        }

        // --- PLAYBACK ---
        async function playLick() {
            if (isPlaying || currentLick.length === 0) return;
            isPlaying = true; ui.generate.disabled = true; ui.replay.disabled = true;
            
            await Tone.start(); 
            const speedMultiplier = parseInt(ui.speed.value) / 100;
            Tone.Transport.bpm.value = activeBPM * speedMultiplier; 
            
            const now = Tone.now() + 0.1;
            let totalTime = 0;
            currentLick.forEach(d => totalTime += Tone.Time(d.dur).toSeconds());

            // Process Backing Track
            const b = currentLick.backingInfo;
            if (b.type === "drone") {
                padSynth.triggerAttackRelease(Tone.Frequency(b.rootMidi, "midi").toNote(), totalTime, now);
            } else if (b.type === "blues") {
                const I_chord = [b.rootMidi, b.rootMidi+4, b.rootMidi+7].map(m => Tone.Frequency(m, "midi").toNote());
                const IV_chord = [b.rootMidi+5, b.rootMidi+9, b.rootMidi+12].map(m => Tone.Frequency(m, "midi").toNote());
                padSynth.triggerAttackRelease(I_chord, totalTime/2, now);
                padSynth.triggerAttackRelease(IV_chord, totalTime/2, now + (totalTime/2));
            }

            let timeOffset = 0;
            currentLick.forEach((data) => {
                const beatSecs = Tone.Time(data.dur).toSeconds();
                synth.triggerAttackRelease(data.note, data.dur, now + timeOffset);
                timeOffset += beatSecs;
            });

            setTimeout(() => { 
                isPlaying = false; ui.generate.disabled = false; ui.replay.disabled = false;
            }, timeOffset * 1000 + 300);
        }

        // --- TAB GENERATOR & UI ---
        function generateTAB() {
            const strings = [ {n:'e',m:64}, {n:'B',m:59}, {n:'G',m:55}, {n:'D',m:50}, {n:'A',m:45}, {n:'E',m:40} ];
            let tabOutput = strings.map(s => s.n + "|-");
            
            let startMidi = currentLick[0].midi;
            let bestString = strings.find(s => startMidi >= s.m && startMidi <= s.m + 15) || strings[3];
            let anchor = Math.max(0, startMidi - bestString.m);

            currentLick.forEach((data) => {
                let placed = false;
                for (let i = 0; i < strings.length; i++) {
                    let fret = data.midi - strings[i].m;
                    if (fret >= 0 && fret <= 24) { 
                        if (Math.abs(fret - anchor) <= 6 || !placed) {
                            tabOutput[i] += fret.toString().padEnd(3, '-');
                            for (let j = 0; j < strings.length; j++) { if (j !== i) tabOutput[j] += "---"; }
                            placed = true; anchor = fret; 
                            break;
                        }
                    }
                }
                if (!placed) for(let j=0; j<strings.length; j++) tabOutput[j] += "---";
            });
            return "<pre>" + tabOutput.map(line => line + "-|").join('\n') + "</pre>";
        }

        function updateRevealUI() {
            if (currentLick.length === 0) { ui.revealText.textContent = "???"; return; }
            if (revealStage === 0) {
                ui.revealHint.textContent = "Hidden"; ui.revealText.textContent = "???";
                ui.revealBtn.textContent = "Reveal Scale Degrees";
            } else if (revealStage === 1) {
                ui.revealHint.textContent = "Scale Degrees"; ui.revealText.textContent = currentLick.map(d => d.degree).join(' - ');
                ui.revealBtn.textContent = "Reveal Exact Notes";
            } else if (revealStage === 2) {
                ui.revealHint.textContent = "Exact Notes"; ui.revealText.textContent = currentLick.map(d => d.note.replace(/[0-9]/g, '')).join(' - ');
                ui.revealBtn.textContent = "Reveal Guitar TAB";
            } else {
                ui.revealHint.textContent = "Guitar TAB"; ui.revealText.innerHTML = generateTAB();
                ui.revealBtn.textContent = "Hide All";
            }
        }

        ui.revealBtn.addEventListener('click', () => {
            if (currentLick.length === 0) return;
            revealStage = revealStage >= 3 ? 0 : revealStage + 1;
            updateRevealUI();
        });

        ui.generate.addEventListener('click', async () => { generateLick(); await playLick(); });
        ui.replay.addEventListener('click', async () => await playLick());

    </script>
</body>
</html>
