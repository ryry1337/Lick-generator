<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lick Generator: Master Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --surface-color: #1f2833;
            --primary-color: #66fcf1;
            --secondary-color: #45a29e;
            --text-color: #c5c6c7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin: 10px 0 5px 0; font-size: 1.5rem; color: var(--primary-color); }
        .subtitle { color: var(--secondary-color); font-size: 0.9rem; margin-bottom: 20px; }

        .dashboard {
            background-color: var(--surface-color);
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }

        .control-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 8px;
        }

        select, input[type="range"] {
            background: #0b0c10;
            color: white;
            border: 1px solid var(--secondary-color);
            padding: 8px;
            border-radius: 5px;
            font-size: 1rem;
        }

        select { width: 45%; }
        input[type="range"] { width: 60%; accent-color: var(--primary-color); }

        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(26px); }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            background-color: transparent;
            color: var(--primary-color);
            border: 2px solid var(--secondary-color);
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        button.primary {
            background: var(--primary-color);
            color: #000;
            border: none;
            grid-column: span 2;
            padding: 16px;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(102, 252, 241, 0.2);
        }

        button:active { transform: scale(0.95); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #reveal-area {
            margin-top: 20px;
            min-height: 90px;
            background: #0b0c10;
            border: 1px solid var(--secondary-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--primary-color);
            padding: 10px;
            text-align: center;
        }
        
        .reveal-hint { font-size: 0.8rem; color: var(--text-color); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;}
    </style>
</head>
<body>

    <h1>Lick Generator Pro</h1>
    <div class="subtitle">Intelligent Ear Training</div>

    <div class="dashboard">
        
        <div class="control-group">
            <label>Key</label>
            <select id="key-select">
                <option value="C">C</option><option value="G">G</option>
                <option value="D">D</option><option value="A" selected>A</option>
                <option value="E">E</option><option value="B">B</option>
            </select>
        </div>

        <div class="control-group">
            <label>Scale</label>
            <select id="scale-select">
                <option value="minPent">Minor Pentatonic</option>
                <option value="majPent">Major Pentatonic</option>
                <option value="blues">Blues Scale</option>
                <option value="dorian">Dorian</option>
            </select>
        </div>

        <div class="control-group">
            <label>Genre Rhythm</label>
            <select id="genre-select">
                <option value="straight">Rock (Straight)</option>
                <option value="swing">Jazz (Swung)</option>
                <option value="triplet">Blues (Triplets)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Difficulty: <span id="diff-display">3</span></label>
            <input type="range" id="diff-slider" min="1" max="5" value="3">
        </div>

        <div class="control-group">
            <label>Arpeggio Only</label>
            <label class="switch">
                <input type="checkbox" id="arp-toggle">
                <span class="slider"></span>
            </label>
        </div>
        
        <hr style="border: 1px solid #1f2833; margin: 20px 0;">

        <div class="control-group" style="background: transparent;">
            <label>Speed: <span id="speed-display">100%</span></label>
            <input type="range" id="speed-slider" min="50" max="100" step="5" value="100">
        </div>

        <div class="btn-grid">
            <button id="generate-btn" class="primary">Generate Lick</button>
            <button id="replay-btn" style="grid-column: span 2;">Replay at Current Speed</button>
            <button id="reveal-btn" style="grid-column: span 2;">Reveal Progression</button>
        </div>
        
        <div id="reveal-area">
            <div class="reveal-hint" id="reveal-hint">Status</div>
            <div id="reveal-text">Ready</div>
        </div>
    </div>

    <script>
        // --- RESTORED ORIGINAL SYNTH ---
        const synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "triangle" },
            envelope: { attack: 0.01, decay: 0.3, sustain: 0.2, release: 1 }
        }).toDestination();
        
        const droneSynth = new Tone.Synth({
            oscillator: { type: "sine" },
            envelope: { attack: 1, decay: 0, sustain: 1, release: 2 }
        }).toDestination();
        droneSynth.volume.value = -20;

        // --- MUSIC THEORY ENGINE ---
        const scales = {
            minPent: { intervals: [0, 3, 5, 7, 10, 12, 15], names: ["1", "b3", "4", "5", "b7", "8", "b3"], arpIndices: [0, 1, 3, 4] },
            majPent: { intervals: [0, 2, 4, 7, 9, 12, 14], names: ["1", "2", "3", "5", "6", "8", "9"], arpIndices: [0, 2, 3] },
            blues:   { intervals: [0, 3, 5, 6, 7, 10, 12, 15], names: ["1", "b3", "4", "b5", "5", "b7", "8", "b3"], arpIndices: [0, 1, 4, 5] },
            dorian:  { intervals: [0, 2, 3, 5, 7, 9, 10, 12], names: ["1", "2", "b3", "4", "5", "6", "b7", "8"], arpIndices: [0, 2, 4, 6] }
        };

        let currentLick = []; 
        let isPlaying = false;
        let revealStage = 0;

        // --- DOM ELEMENTS ---
        const ui = {
            key: document.getElementById('key-select'),
            scale: document.getElementById('scale-select'),
            genre: document.getElementById('genre-select'),
            diff: document.getElementById('diff-slider'),
            diffDisp: document.getElementById('diff-display'),
            arp: document.getElementById('arp-toggle'),
            speed: document.getElementById('speed-slider'),
            speedDisp: document.getElementById('speed-display'),
            generate: document.getElementById('generate-btn'),
            replay: document.getElementById('replay-btn'),
            revealBtn: document.getElementById('reveal-btn'),
            revealText: document.getElementById('reveal-text'),
            revealHint: document.getElementById('reveal-hint')
        };

        ui.diff.addEventListener('input', e => ui.diffDisp.textContent = e.target.value);
        ui.speed.addEventListener('input', e => ui.speedDisp.textContent = e.target.value + '%');

        function generateLick() {
            currentLick = [];
            const key = ui.key.value;
            const scaleType = ui.scale.value;
            const rhythmStyle = ui.genre.value;
            const diff = parseInt(ui.diff.value);
            const isArp = ui.arp.checked;
            
            const scaleData = scales[scaleType];
            const maxNotes = diff * 2 + 2; 
            const rootOctave = key === "C" || key === "D" ? "4" : "3";
            const rootFreq = Tone.Frequency(key + rootOctave);

            let currentIndex = 0; 

            for (let i = 0; i < maxNotes; i++) {
                // Rhythm based on "Genre" dropdown
                let duration = "8n";
                if (rhythmStyle === "swing" && i % 2 !== 0) duration = "16n"; // Basic swing feel
                if (rhythmStyle === "triplet") duration = "8t";
                if (rhythmStyle === "straight" && diff > 3 && Math.random() > 0.7) duration = "16n";
                if (i === maxNotes - 1) duration = "4n"; 

                // Human logic
                if (i > 0) {
                    if (isArp) {
                        currentIndex = scaleData.arpIndices[Math.floor(Math.random() * scaleData.arpIndices.length)];
                        if (diff > 3 && Math.random() > 0.5) currentIndex += scaleData.intervals.length - 1;
                    } else {
                        let move = Math.random();
                        if (move < 0.6) {
                            currentIndex += (Math.random() > 0.5 ? 1 : -1);
                        } else if (move < 0.9 && diff > 2) {
                            currentIndex += (Math.random() > 0.5 ? 2 : -2);
                        }
                        if (i === maxNotes - 1) {
                            currentIndex = Math.random() > 0.5 ? 0 : scaleData.arpIndices[scaleData.arpIndices.length - 1]; 
                        }
                        currentIndex = Math.max(0, Math.min(currentIndex, scaleData.intervals.length - 1));
                    }
                }

                currentLick.push({
                    note: rootFreq.transpose(scaleData.intervals[currentIndex]).toNote(),
                    degree: scaleData.names[currentIndex],
                    dur: duration
                });
            }
            
            revealStage = 0;
            updateRevealUI();
        }

        async function playLick() {
            if (isPlaying || currentLick.length === 0) return;
            isPlaying = true;
            
            // Disable buttons during playback to prevent overlapping clicks
            ui.generate.disabled = true;
            ui.replay.disabled = true;
            
            await Tone.start(); 
            
            // Apply speed scaling directly to the transport BPM
            const speedMultiplier = parseInt(ui.speed.value) / 100;
            Tone.Transport.bpm.value = 120 * speedMultiplier; 
            
            droneSynth.triggerAttack(ui.key.value + "2");

            const now = Tone.now() + 0.1;
            let timeOffset = 0;

            currentLick.forEach((data) => {
                const beatSecs = Tone.Time(data.dur).toSeconds();
                synth.triggerAttackRelease(data.note, data.dur, now + timeOffset);
                timeOffset += beatSecs;
            });

            setTimeout(() => { 
                isPlaying = false;
                ui.generate.disabled = false;
                ui.replay.disabled = false;
                droneSynth.triggerRelease();
            }, timeOffset * 1000 + 300);
        }

        function updateRevealUI() {
            if (currentLick.length === 0) { ui.revealText.textContent = "???"; return; }
            const states = [
                { hint: "Hidden", text: "???" },
                { hint: "First Note", text: currentLick[0].note.replace(/[0-9]/g, '') + " ..." },
                { hint: "Scale Degrees", text: currentLick.map(d => d.degree).join(' - ') },
                { hint: "Exact Notes", text: currentLick.map(d => d.note.replace(/[0-9]/g, '')).join(' - ') }
            ];
            
            ui.revealHint.textContent = states[revealStage].hint;
            ui.revealText.textContent = states[revealStage].text;
            ui.revealBtn.textContent = revealStage === 3 ? "Hide Notes" : "Reveal Next Hint";
        }

        ui.revealBtn.addEventListener('click', () => {
            if (currentLick.length === 0) return;
            revealStage = revealStage >= 3 ? 0 : revealStage + 1;
            updateRevealUI();
        });

        ui.generate.addEventListener('click', async () => { generateLick(); await playLick(); });
        ui.replay.addEventListener('click', async () => await playLick());

    </script>
</body>
</html>
