<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lick Generator: The Human Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --surface-color: #161b22;
            --primary-color: #e2b714; /* Session Gold */
            --secondary-color: #30363d;
            --text-color: #c9d1d9;
            --text-muted: #8b949e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin: 10px 0 0 0; font-size: 1.5rem; color: var(--primary-color); text-align: center;}
        .subtitle { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;}

        .dashboard {
            background-color: var(--surface-color);
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            box-sizing: border-box;
            border: 1px solid var(--secondary-color);
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary-color);
            margin: 15px 0 8px 0;
            border-bottom: 1px solid var(--secondary-color);
            padding-bottom: 4px;
        }
        .section-title:first-child { margin-top: 0; }

        .control-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }

        select, input[type="range"] {
            background: var(--bg-color);
            color: white;
            border: 1px solid var(--secondary-color);
            padding: 6px;
            border-radius: 4px;
            font-size: 0.85rem;
            max-width: 55%;
        }

        select { width: 55%; }
        input[type="range"] { width: 50%; accent-color: var(--primary-color); }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--secondary-color);
            padding: 12px 8px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        button.primary { background: var(--primary-color); color: #000; border: none; font-size: 1.1rem; padding: 14px; }
        button.action { border-color: var(--primary-color); color: var(--primary-color); }
        button:active { transform: scale(0.96); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #reveal-area {
            margin-top: 15px;
            background: #000;
            border: 1px solid var(--secondary-color);
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            overflow-x: auto;
        }
        
        .reveal-hint { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;}
        .reveal-content { font-size: 1.1rem; color: var(--primary-color); font-weight: bold; min-height: 30px;}
        .active-params { font-size: 0.7rem; color: #aaa; margin-top: 10px; border-top: 1px dashed #333; padding-top: 5px;}
        
        pre { font-family: 'Courier New', monospace; text-align: left; margin: 0; font-size: 0.85rem; color: var(--text-color); line-height: 1.2; }
    </style>
</head>
<body>

    <h1>The Human Engine</h1>
    <div class="subtitle">Procedural Session Guitarist</div>

    <div class="dashboard">
        
        <div class="section-title">Tonal Center</div>
        <div class="control-group">
            <label>Key</label>
            <select id="key-select">
                <option value="C">C</option><option value="G">G</option><option value="D">D</option>
                <option value="A" selected>A</option><option value="E">E</option><option value="B">B</option>
            </select>
        </div>
        <div class="control-group">
            <label>Scale</label>
            <select id="scale-select">
                <option value="minPent">Minor Pentatonic</option>
                <option value="blues" selected>Blues Scale</option>
                <option value="dorian">Dorian</option>
                <option value="mixolydian">Mixolydian</option>
                <option value="natMinor">Natural Minor</option>
            </select>
        </div>
        <div class="control-group">
            <label>Register</label>
            <select id="register-select">
                <option value="low">Low (Riffs)</option>
                <option value="mid" selected>Mid (Standard)</option>
                <option value="high">High (Solo)</option>
            </select>
        </div>

        <div class="section-title">Phrasing & Feel</div>
        <div class="control-group">
            <label>Genre Rhythm</label>
            <select id="genre-select">
                <option value="rock" selected>Rock (Straight / Driving)</option>
                <option value="blues">Blues (Swung / Triplets)</option>
                <option value="jazz">Jazz (Syncopated)</option>
            </select>
        </div>
        <div class="control-group">
            <label>Spiciness (Chromatics): <span id="spice-display">15%</span></label>
            <input type="range" id="spice-slider" min="0" max="40" step="5" value="15">
        </div>
        <div class="control-group">
            <label>Length (Notes): <span id="diff-display">7</span></label>
            <input type="range" id="diff-slider" min="4" max="16" value="7">
        </div>

        <div class="section-title">Playback</div>
        <div class="control-group">
            <label>Backing Track</label>
            <select id="backing-select">
                <option value="blues">I - IV - V Progression</option>
                <option value="drone">Static Drone</option>
                <option value="none">Metronome Only</option>
            </select>
        </div>
        <div class="control-group">
            <label>Speed: <span id="speed-display">100%</span></label>
            <input type="range" id="speed-slider" min="50" max="150" step="5" value="100">
        </div>

        <div class="btn-grid">
            <button id="generate-btn" class="primary" style="grid-column: span 2;">Generate & Play</button>
            <button id="replay-btn">Replay Audio</button>
            <button id="reveal-btn" class="action">Reveal Notes</button>
        </div>
        
        <div id="reveal-area">
            <div class="reveal-hint" id="reveal-hint">Status</div>
            <div class="reveal-content" id="reveal-text">Ready</div>
        </div>
    </div>

    <script>
        // --- AUDIO ENGINE SETUP ---
        // 1. The Reverb Room (Glues everything together, kills ear fatigue)
        const roomReverb = new Tone.Reverb({ decay: 2.5, wet: 0.35 }).toDestination();
        
        // 2. Monophonic Lead Synth (Crucial for Portamento/Slides)
        const leadSynth = new Tone.Synth({
            oscillator: { type: "triangle" },
            envelope: { attack: 0.01, decay: 0.4, sustain: 0.1, release: 0.8 }
        }).connect(roomReverb);
        
        // 3. Polyphonic Backing Pad
        const padSynth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sine" },
            envelope: { attack: 0.5, decay: 0.5, sustain: 0.5, release: 3.0 } // 3 second release for a long musical tail
        }).connect(roomReverb);
        padSynth.volume.value = -18; 

        // 4. Count-In Click
        const clickSynth = new Tone.MembraneSynth({ pitchDecay: 0.008, octaves: 2 }).toDestination();
        clickSynth.volume.value = -10;

        // --- 3-OCTAVE SCALE GENERATOR ---
        function createScale(intervals, names, arpIndices, octaves = 3) {
            let resInt = [], resNames = [], resArp = [];
            for (let o = 0; o < octaves; o++) {
                for (let i = 0; i < intervals.length; i++) {
                    resInt.push(intervals[i] + (o * 12));
                    resNames.push(names[i]);
                    if (arpIndices.includes(i)) resArp.push(resInt.length - 1);
                }
            }
            resInt.push(octaves * 12); resNames.push("8");
            if (arpIndices.includes(0)) resArp.push(resInt.length - 1);
            return { intervals: resInt, names: resNames, arpIndices: resArp };
        }

        const scales = {
            minPent:    createScale([0,3,5,7,10], ["1","b3","4","5","b7"], [0,1,3]),
            blues:      createScale([0,3,5,6,7,10], ["1","b3","4","b5","5","b7"], [0,1,4]),
            dorian:     createScale([0,2,3,5,7,9,10], ["1","2","b3","4","5","6","b7"], [0,2,4,6]),
            mixolydian: createScale([0,2,4,5,7,9,10], ["1","2","3","4","5","6","b7"], [0,2,4,6]),
            natMinor:   createScale([0,2,3,5,7,8,10], ["1","2","b3","4","5","b6","b7"], [0,2,4,6])
        };

        let currentLick = []; 
        let isPlaying = false; 
        let revealStage = 0;
        let activeBPM = 100;

        // --- DOM ELEMENTS & LISTENERS ---
        const ui = {
            key: document.getElementById('key-select'), scale: document.getElementById('scale-select'),
            register: document.getElementById('register-select'), genre: document.getElementById('genre-select'),
            spice: document.getElementById('spice-slider'), diff: document.getElementById('diff-slider'), 
            backing: document.getElementById('backing-select'), speed: document.getElementById('speed-slider'),
            spiceDisp: document.getElementById('spice-display'), diffDisp: document.getElementById('diff-display'),
            speedDisp: document.getElementById('speed-display'), generate: document.getElementById('generate-btn'),
            replay: document.getElementById('replay-btn'), revealBtn: document.getElementById('reveal-btn'),
            revealText: document.getElementById('reveal-text'), revealHint: document.getElementById('reveal-hint')
        };

        ui.diff.addEventListener('input', e => ui.diffDisp.textContent = e.target.value);
        ui.spice.addEventListener('input', e => ui.spiceDisp.textContent = e.target.value + '%');
        ui.speed.addEventListener('input', e => ui.speedDisp.textContent = e.target.value + '%');

        // --- THE HUMAN COMPOSITION ALGORITHM ---
        function generateLick() {
            currentLick = [];
            const scaleData = scales[ui.scale.value];
            const maxNotes = parseInt(ui.diff.value); 
            const spiceProb = parseInt(ui.spice.value) / 100;
            const genre = ui.genre.value;
            
            let baseOctave = (ui.register.value === "low") ? 2 : (ui.register.value === "high" ? 4 : 3);
            if (["C", "C#", "D", "D#"].includes(ui.key.value) && baseOctave > 1) baseOctave += 1;
            
            const rootFreq = Tone.Frequency(ui.key.value + baseOctave);
            
            // Phase 1: The Hook (Always start on a strong chord tone in the middle register)
            let currentIndex = scaleData.arpIndices[Math.floor(scaleData.arpIndices.length / 2)];
            // Ground it to root or 5th
            while(scaleData.names[currentIndex] !== "1" && scaleData.names[currentIndex] !== "5") {
                currentIndex--;
            }

            for (let i = 0; i < maxNotes; i++) {
                
                // Rhythm Generation (Genre-based)
                let duration = "8n"; 
                if (genre === "blues") duration = "8t";
                if (genre === "rock" && Math.random() > 0.6) duration = "16n";
                if (genre === "jazz") duration = (i % 2 !== 0) ? "16n" : "8n";
                
                // Phase 3: The Landing
                if (i === maxNotes - 1) {
                    duration = "2n"; // Hold the final note
                    // Force resolution to the Root
                    let closestRoot = 0;
                    let minDiff = 999;
                    scaleData.names.forEach((name, idx) => {
                        if ((name === "1" || name === "8") && Math.abs(idx - currentIndex) < minDiff) {
                            minDiff = Math.abs(idx - currentIndex);
                            closestRoot = idx;
                        }
                    });
                    currentIndex = closestRoot;
                } 
                // Phase 2: The Wander
                else if (i > 0) {
                    // Miles Davis Rule: 10% chance for a musical Rest (except first/last note)
                    if (Math.random() < 0.10 && i < maxNotes - 2) {
                        currentLick.push({ isRest: true, dur: "8n" });
                        continue; 
                    }

                    // Standard Step/Leap
                    currentIndex += (Math.random() > 0.4 ? 1 : -1) * (Math.random() > 0.75 ? 2 : 1);
                    currentIndex = Math.max(0, Math.min(currentIndex, scaleData.intervals.length - 1));
                }

                const midiNote = rootFreq.transpose(scaleData.intervals[currentIndex]).toMidi();
                
                // Spiciness Check (Chromatic Passing Tones)
                let isPassingTone = false;
                let actualMidi = midiNote;
                let displayDegree = scaleData.names[currentIndex];

                if (i > 0 && i < maxNotes - 1 && Math.random() < spiceProb) {
                    // Inject a chromatic note a half-step below our target
                    actualMidi = midiNote - 1;
                    displayDegree = "*chrom*";
                    isPassingTone = true;
                    duration = "16n"; // Passing tones are played fast to resolve
                }

                // Synthetic Articulation (Slide check)
                let slideTrigger = false;
                if (i > 0 && !currentLick[currentLick.length-1].isRest) {
                    let prevMidi = currentLick[currentLick.length-1].midi;
                    // If the note is 1 or 2 frets away, 20% chance to slide into it
                    if (Math.abs(actualMidi - prevMidi) <= 2 && Math.random() < 0.20) {
                        slideTrigger = true;
                    }
                }

                // Humanize Velocity (Pocket groove)
                // Downbeats slightly louder, 16th notes quieter
                let vel = 0.8 + (Math.random() * 0.2); 
                if (duration === "16n") vel -= 0.15; 

                currentLick.push({
                    isRest: false,
                    midi: actualMidi,
                    note: Tone.Frequency(actualMidi, "midi").toNote(),
                    degree: displayDegree,
                    dur: duration,
                    slide: slideTrigger,
                    velocity: vel
                });
            }
            
            // Generate Backing Track Context
            if (genre === "rock") activeBPM = 110;
            else if (genre === "blues") activeBPM = 85;
            else activeBPM = 120; // Jazz

            currentLick.backingInfo = { type: ui.backing.value, rootMidi: Tone.Frequency(ui.key.value + "2").toMidi() };
            
            revealStage = 0; updateRevealUI();
        }

        // --- PLAYBACK & GROOVE ENGINE ---
        async function playLick() {
            if (isPlaying || currentLick.length === 0) return;
            isPlaying = true; ui.generate.disabled = true; ui.replay.disabled = true;
            
            await Tone.start(); 
            
            // Audio engine initialization (required for Reverb room setup on some mobile browsers)
            await roomReverb.generate(); 

            const speedMultiplier = parseInt(ui.speed.value) / 100;
            Tone.Transport.bpm.value = activeBPM * speedMultiplier; 
            
            const beatDuration = 60 / Tone.Transport.bpm.value;
            const countInDuration = beatDuration * 4;
            const now = Tone.now() + 0.1;
            
            // 1. Play Count-In (4 clicks)
            for(let i=0; i<4; i++) {
                clickSynth.triggerAttackRelease(i===0 ? "G4" : "C4", "16n", now + (i * beatDuration));
            }

            const musicStart = now + countInDuration;
            
            // Calculate Total Duration
            let totalTime = 0;
            currentLick.forEach(d => totalTime += Tone.Time(d.dur).toSeconds());

            // 2. Play Backing Track (With extended 2.0 second tail)
            const b = currentLick.backingInfo;
            const trackTail = totalTime + 2.0; 

            if (b.type === "drone") {
                padSynth.triggerAttackRelease(Tone.Frequency(b.rootMidi, "midi").toNote(), trackTail, musicStart);
            } else if (b.type === "blues") {
                const I_chord = [b.rootMidi, b.rootMidi+4, b.rootMidi+7].map(m => Tone.Frequency(m, "midi").toNote());
                const IV_chord = [b.rootMidi+5, b.rootMidi+9, b.rootMidi+12].map(m => Tone.Frequency(m, "midi").toNote());
                padSynth.triggerAttackRelease(I_chord, totalTime/2, musicStart);
                padSynth.triggerAttackRelease(IV_chord, (totalTime/2) + 2.0, musicStart + (totalTime/2));
            }

            // 3. Play Lead Lick
            let timeOffset = 0;
            currentLick.forEach((data) => {
                const beatSecs = Tone.Time(data.dur).toSeconds();
                
                if (!data.isRest) {
                    // Micro-timing offset (-15ms to +15ms) for human push/pull
                    let humanTiming = timeOffset + ((Math.random() * 0.03) - 0.015);
                    
                    // Portamento Articulation logic
                    if (data.slide) {
                        leadSynth.portamento = 0.08; // 80ms glide
                    } else {
                        leadSynth.portamento = 0.0;
                    }

                    leadSynth.triggerAttackRelease(data.note, data.dur, musicStart + humanTiming, data.velocity);
                }
                timeOffset += beatSecs;
            });

            // Unlock UI after total time + tail
            setTimeout(() => { 
                isPlaying = false; ui.generate.disabled = false; ui.replay.disabled = false;
            }, (countInDuration + totalTime + 2.0) * 1000);
        }

        // --- SMART "CAGED" TAB GENERATOR ---
        function generateTAB() {
            const strings = [ {n:'e',m:64}, {n:'B',m:59}, {n:'G',m:55}, {n:'D',m:50}, {n:'A',m:45}, {n:'E',m:40} ];
            let tabOutput = strings.map(s => s.n + "|-");
            
            // Set a rigid positional anchor based on the first played note
            let firstNote = currentLick.find(n => !n.isRest);
            if (!firstNote) return "";
            
            let anchorMidi = firstNote.midi;
            let bestString = strings.find(s => anchorMidi >= s.m && anchorMidi <= s.m + 10) || strings[3];
            let strictAnchor = Math.max(0, anchorMidi - bestString.m);

            currentLick.forEach((data) => {
                if (data.isRest) {
                    for(let j=0; j<strings.length; j++) tabOutput[j] += "---";
                    return;
                }

                let placed = false;
                // Favor strings that keep the fret within 4 frets of our strict anchor (CAGED box)
                for (let i = 0; i < strings.length; i++) {
                    let fret = data.midi - strings[i].m;
                    if (fret >= 0 && fret <= 24) { 
                        if (Math.abs(fret - strictAnchor) <= 4 || !placed) {
                            let mark = data.slide ? "/" + fret : fret; // Visual slide indicator
                            tabOutput[i] += mark.toString().padEnd(3, '-');
                            for (let j = 0; j < strings.length; j++) { if (j !== i) tabOutput[j] += "---"; }
                            placed = true; 
                            break;
                        }
                    }
                }
                if (!placed) for(let j=0; j<strings.length; j++) tabOutput[j] += "---";
            });
            return "<pre>" + tabOutput.map(line => line + "-|").join('\n') + "</pre>";
        }

        // --- REVEAL UI ---
        function updateRevealUI() {
            if (currentLick.length === 0) { ui.revealText.textContent = "???"; return; }
            if (revealStage === 0) {
                ui.revealHint.textContent = "Hidden"; ui.revealText.textContent = "???";
                ui.revealBtn.textContent = "Reveal Scale Degrees";
            } else if (revealStage === 1) {
                ui.revealHint.textContent = "Scale Degrees"; 
                ui.revealText.textContent = currentLick.map(d => d.isRest ? "(rest)" : d.degree).join(' - ');
                ui.revealBtn.textContent = "Reveal Exact Notes";
            } else if (revealStage === 2) {
                ui.revealHint.textContent = "Exact Notes"; 
                ui.revealText.textContent = currentLick.map(d => d.isRest ? "(rest)" : d.note.replace(/[0-9]/g, '')).join(' - ');
                ui.revealBtn.textContent = "Reveal Guitar TAB";
            } else {
                ui.revealHint.textContent = "Guitar TAB"; ui.revealText.innerHTML = generateTAB();
                ui.revealBtn.textContent = "Hide All";
            }
        }

        ui.revealBtn.addEventListener('click', () => {
            if (currentLick.length === 0) return;
            revealStage = revealStage >= 3 ? 0 : revealStage + 1;
            updateRevealUI();
        });

        ui.generate.addEventListener('click', async () => { generateLick(); await playLick(); });
        ui.replay.addEventListener('click', async () => await playLick());

    </script>
</body>
</html>
