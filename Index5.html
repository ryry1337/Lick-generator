<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diagnostics Build 11.3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root {
            --bg-color: #0a0c10; --surface-color: #161821;
            --primary-color: #00e676; --chord-color: #d500f9; 
            --secondary-color: #2a2e3d; --text-color: #e2e8f0; --text-muted: #64748b;
        }

        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }

        /* DEBUGGER BAR */
        #debugger { width: 100%; max-width: 400px; background: #222; border: 2px solid yellow; color: yellow; padding: 10px; margin-bottom: 15px; text-align: center; font-weight: bold; border-radius: 8px; box-sizing: border-box; }
        
        #start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,12,16,0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--primary-color); cursor: pointer; }
        #start-overlay h1 { font-size: 2.5rem; margin-bottom: 10px; }

        .tab-container { display: flex; width: 100%; max-width: 400px; margin-bottom: 15px; background: var(--surface-color); border-radius: 8px; border: 1px solid var(--secondary-color); }
        .tab-btn { flex: 1; padding: 14px; background: transparent; color: var(--text-muted); border: none; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .tab-btn.active { background: var(--primary-color); color: #000; }

        .dashboard { background-color: var(--surface-color); padding: 18px; border-radius: 12px; width: 100%; max-width: 400px; box-sizing: border-box; border: 1px solid var(--secondary-color); }
        .btn-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 20px; }
        button.action-btn { background-color: transparent; color: var(--text-color); border: 1px solid var(--secondary-color); padding: 16px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
        button.primary { background: var(--primary-color); color: #000; border: none; }
        button.danger { background: #ff3b30; color: white; border: none;}
    </style>
</head>
<body>

    <div id="start-overlay">
        <h1>TAP HERE</h1>
        <p>To initialize audio engine</p>
    </div>

    <div id="debugger">Audio Engine: <span id="audio-status">WAITING</span></div>

    <div class="tab-container">
        <button class="tab-btn active" id="tab-licks">Test Lick</button>
    </div>

    <div class="dashboard licks-view" id="view-licks">
        <div class="btn-grid">
            <button id="test-beep" class="action-btn" style="border-color: yellow; color: yellow;">1. Test Simple Beep</button>
            <button id="lick-gen-btn" class="action-btn primary">2. Generate & Play Lick</button>
            <button id="global-stop" class="action-btn danger">🛑 Stop All</button>
        </div>
    </div>

    <script>
        // --- PURE, NAKED AUDIO ENGINE (NO FX) ---
        // Routed directly to destination to prevent node crashing
        const leadSynth = new Tone.Synth().toDestination();
        
        const statusDisplay = document.getElementById('audio-status');

        // Monitor AudioContext Status
        setInterval(() => {
            if (Tone.context) {
                let state = Tone.context.state;
                statusDisplay.textContent = state.toUpperCase();
                if (state === 'running') {
                    statusDisplay.style.color = '#00e676'; // Green
                    document.getElementById('debugger').style.borderColor = '#00e676';
                } else if (state === 'suspended') {
                    statusDisplay.style.color = '#ff3b30'; // Red
                    document.getElementById('debugger').style.borderColor = '#ff3b30';
                }
            }
        }, 500);

        // AGGRESSIVE WAKE UP
        async function wakeAudio() {
            if (Tone.context.state !== 'running') {
                await Tone.start();
            }
        }

        // Bind to both click and touchstart
        const overlay = document.getElementById('start-overlay');
        overlay.addEventListener('click', async () => { await wakeAudio(); overlay.style.display = 'none'; });
        overlay.addEventListener('touchstart', async () => { await wakeAudio(); overlay.style.display = 'none'; });

        // 1. SIMPLE BEEP TEST
        document.getElementById('test-beep').addEventListener('click', async () => {
            await wakeAudio();
            leadSynth.triggerAttackRelease("C4", "8n");
        });

        // 2. LICK TEST
        const scale = ["A3", "C4", "D4", "E4", "G4", "A4"];
        
        document.getElementById('lick-gen-btn').addEventListener('click', async () => {
            await wakeAudio();
            Tone.Transport.stop();
            Tone.Transport.cancel(0);
            
            Tone.Transport.bpm.value = 110;
            let timeOffset = 0;
            
            for(let i=0; i<6; i++) {
                let note = scale[Math.floor(Math.random() * scale.length)];
                Tone.Transport.scheduleOnce((time) => {
                    leadSynth.triggerAttackRelease(note, "8n", time);
                }, "+" + timeOffset);
                timeOffset += 0.25; // Quarter second apart
            }
            
            Tone.Transport.start();
        });

        // STOP
        document.getElementById('global-stop').addEventListener('click', () => {
            Tone.Transport.stop();
            Tone.Transport.cancel(0);
            leadSynth.releaseAll();
        });

    </script>
</body>
</html>
