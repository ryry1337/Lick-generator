<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lick Generator: Master Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --surface-color: #1f2833;
            --primary-color: #66fcf1;
            --secondary-color: #45a29e;
            --text-color: #c5c6c7;
            --accent-color: #ff5722;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin: 10px 0 5px 0; font-size: 1.5rem; color: var(--primary-color); }
        .subtitle { color: var(--secondary-color); font-size: 0.9rem; margin-bottom: 20px; }

        .dashboard {
            background-color: var(--surface-color);
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }

        .control-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 8px;
        }

        select, input[type="range"] {
            background: #0b0c10;
            color: white;
            border: 1px solid var(--secondary-color);
            padding: 8px;
            border-radius: 5px;
            font-size: 1rem;
        }

        select { width: 45%; }
        input[type="range"] { width: 60%; accent-color: var(--primary-color); }

        /* Toggles */
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(26px); }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            background-color: transparent;
            color: var(--primary-color);
            border: 2px solid var(--secondary-color);
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        button.primary {
            background: var(--primary-color);
            color: #000;
            border: none;
            grid-column: span 2;
            padding: 16px;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(102, 252, 241, 0.2);
        }

        button:active { transform: scale(0.95); }

        #reveal-area {
            margin-top: 20px;
            min-height: 90px;
            background: #0b0c10;
            border: 1px solid var(--secondary-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--primary-color);
            padding: 10px;
            text-align: center;
        }
        
        .reveal-hint { font-size: 0.8rem; color: var(--text-color); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;}
    </style>
</head>
<body>

    <h1>Lick Generator Pro</h1>
    <div class="subtitle">Intelligent Ear Training</div>

    <div class="dashboard">
        
        <div class="control-group">
            <label>Key</label>
            <select id="key-select">
                <option value="C">C</option><option value="G">G</option>
                <option value="D">D</option><option value="A" selected>A</option>
                <option value="E">E</option><option value="B">B</option>
            </select>
        </div>

        <div class="control-group">
            <label>Genre Profile</label>
            <select id="genre-select">
                <option value="blues">Blues</option>
                <option value="rock">Rock</option>
                <option value="jazz">Jazz</option>
                <option value="metal">Metal</option>
            </select>
        </div>

        <div class="control-group">
            <label>Difficulty: <span id="diff-display">3</span></label>
            <input type="range" id="diff-slider" min="1" max="5" value="3">
        </div>

        <div class="control-group">
            <label>Arpeggio / Chord Tones</label>
            <label class="switch">
                <input type="checkbox" id="arp-toggle">
                <span class="slider"></span>
            </label>
        </div>

        <div class="btn-grid">
            <button id="generate-btn" class="primary">Generate Lick</button>
            <button id="replay-btn">Replay Lick</button>
            <button id="half-speed-btn">1/2 Speed</button>
            <button id="reveal-btn" style="grid-column: span 2;">Reveal Progression</button>
        </div>
        
        <div id="reveal-area">
            <div class="reveal-hint" id="reveal-hint">Status</div>
            <div id="reveal-text">Ready</div>
        </div>
    </div>

    <script>
        // --- SYNTH SETUP (Changes based on Genre) ---
        const filter = new Tone.Filter(2000, "lowpass").toDestination();
        const synth = new Tone.PolySynth(Tone.Synth).connect(filter);
        
        const droneSynth = new Tone.Synth({
            oscillator: { type: "sine" },
            envelope: { attack: 1, decay: 0, sustain: 1, release: 2 }
        }).toDestination();
        droneSynth.volume.value = -20;

        // --- MUSIC THEORY ENGINE ---
        const scales = {
            blues: { intervals: [0, 3, 5, 6, 7, 10, 12, 15], names: ["1", "b3", "4", "b5", "5", "b7", "8", "b3"], arpIndices: [0, 1, 4, 5] },
            rock:  { intervals: [0, 2, 4, 7, 9, 12, 14, 16], names: ["1", "2", "3", "5", "6", "8", "9", "10"], arpIndices: [0, 2, 3] },
            jazz:  { intervals: [0, 2, 3, 5, 7, 9, 10, 12], names: ["1", "2", "b3", "4", "5", "6", "b7", "8"], arpIndices: [0, 2, 4, 6] },
            metal: { intervals: [0, 1, 4, 5, 7, 8, 10, 12], names: ["1", "b2", "3", "4", "5", "b6", "b7", "8"], arpIndices: [0, 2, 4] }
        };

        const genreProfiles = {
            blues: { wave: "triangle", bpmBase: 80, filter: 1500 },
            rock:  { wave: "sawtooth", bpmBase: 110, filter: 3000 },
            jazz:  { wave: "sine", bpmBase: 130, filter: 800 },
            metal: { wave: "square", bpmBase: 160, filter: 4000 }
        };

        let currentLick = []; 
        let isPlaying = false;
        let revealStage = 0;

        // --- DOM ELEMENTS ---
        const ui = {
            key: document.getElementById('key-select'),
            genre: document.getElementById('genre-select'),
            diff: document.getElementById('diff-slider'),
            diffDisp: document.getElementById('diff-display'),
            arp: document.getElementById('arp-toggle'),
            generate: document.getElementById('generate-btn'),
            replay: document.getElementById('replay-btn'),
            halfSpeed: document.getElementById('half-speed-btn'),
            revealBtn: document.getElementById('reveal-btn'),
            revealText: document.getElementById('reveal-text'),
            revealHint: document.getElementById('reveal-hint')
        };

        ui.diff.addEventListener('input', e => ui.diffDisp.textContent = e.target.value);

        // --- THE "HUMAN" GENERATOR ALGORITHM ---
        function generateLick() {
            currentLick = [];
            const genre = ui.genre.value;
            const key = ui.key.value;
            const diff = parseInt(ui.diff.value);
            const isArp = ui.arp.checked;
            
            const scaleData = scales[genre];
            const maxNotes = diff * 2 + 2; // Diff 1 = 4 notes, Diff 5 = 12 notes
            const rootOctave = key === "C" || key === "D" ? "4" : "3";
            const rootFreq = Tone.Frequency(key + rootOctave);

            // Configure Synth Tone
            synth.set({ oscillator: { type: genreProfiles[genre].wave } });
            filter.frequency.value = genreProfiles[genre].filter;

            let currentIndex = 0; // Always start on root

            for (let i = 0; i < maxNotes; i++) {
                // Determine rhythm (higher difficulty = more rhythmic variation)
                let duration = "8n";
                if (diff > 2 && Math.random() > 0.7) duration = "16n";
                if (i === maxNotes - 1) duration = "4n"; // Last note is always long

                // Calculate next note based on "Human" Logic
                if (i > 0) {
                    if (isArp) {
                        // Pick random index from the allowed arpeggio indices
                        currentIndex = scaleData.arpIndices[Math.floor(Math.random() * scaleData.arpIndices.length)];
                        // Add octave displacement for higher difficulties
                        if (diff > 3 && Math.random() > 0.5) currentIndex += scaleData.intervals.length - 1;
                    } else {
                        // Step-and-Leap logic
                        let move = Math.random();
                        if (move < 0.6) {
                            // Step (Move up or down by 1)
                            currentIndex += (Math.random() > 0.5 ? 1 : -1);
                        } else if (move < 0.9 && diff > 2) {
                            // Leap (Move up or down by 2 or 3)
                            currentIndex += (Math.random() > 0.5 ? 2 : -2);
                        } else {
                            // Stay on same note (rhythmic repetition)
                            currentIndex += 0;
                        }

                        // Force resolution to Root or 5th on final note
                        if (i === maxNotes - 1) {
                            currentIndex = Math.random() > 0.5 ? 0 : 4; 
                        }

                        // Keep within bounds of array to prevent errors
                        currentIndex = Math.max(0, Math.min(currentIndex, scaleData.intervals.length - 1));
                    }
                }

                currentLick.push({
                    note: rootFreq.transpose(scaleData.intervals[currentIndex]).toNote(),
                    degree: scaleData.names[currentIndex],
                    dur: duration
                });
            }
            
            revealStage = 0;
            updateRevealUI();
        }

        async function playLick(speedMultiplier = 1) {
            if (isPlaying || currentLick.length === 0) return;
            isPlaying = true;
            await Tone.start(); 
            
            const genre = ui.genre.value;
            const diff = parseInt(ui.diff.value);
            
            // Speed scales with difficulty and genre baseline
            const baseBpm = genreProfiles[genre].bpmBase;
            Tone.Transport.bpm.value = (baseBpm + (diff * 10)) * speedMultiplier; 
            
            // Start Drone
            droneSynth.triggerAttack(ui.key.value + "2");

            const now = Tone.now() + 0.1;
            let timeOffset = 0;

            currentLick.forEach((data) => {
                const beatSecs = Tone.Time(data.dur).toSeconds();
                synth.triggerAttackRelease(data.note, data.dur, now + timeOffset);
                timeOffset += beatSecs;
            });

            setTimeout(() => { 
                isPlaying = false;
                droneSynth.triggerRelease();
            }, timeOffset * 1000 + 500);
        }

        // --- REVEAL UI ---
        function updateRevealUI() {
            if (currentLick.length === 0) { ui.revealText.textContent = "???"; return; }
            const states = [
                { hint: "Hidden", text: "???" },
                { hint: "First Note", text: currentLick[0].note.replace(/[0-9]/g, '') + " ..." },
                { hint: "Scale Degrees", text: currentLick.map(d => d.degree).join(' - ') },
                { hint: "Exact Notes", text: currentLick.map(d => d.note.replace(/[0-9]/g, '')).join(' - ') }
            ];
            
            ui.revealHint.textContent = states[revealStage].hint;
            ui.revealText.textContent = states[revealStage].text;
            ui.revealBtn.textContent = revealStage === 3 ? "Hide Notes" : "Reveal Next Hint";
        }

        ui.revealBtn.addEventListener('click', () => {
            if (currentLick.length === 0) return;
            revealStage = revealStage >= 3 ? 0 : revealStage + 1;
            updateRevealUI();
        });

        // --- EVENTS ---
        ui.generate.addEventListener('click', async () => { generateLick(); await playLick(1); });
        ui.replay.addEventListener('click', async () => await playLick(1));
        ui.halfSpeed.addEventListener('click', async () => await playLick(0.5));

    </script>
</body>
</html>
