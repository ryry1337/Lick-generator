<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Practice Toolkit v10.1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root {
            --bg-color: #090a0f;
            --surface-color: #14161f;
            --primary-color: #00ffcc; 
            --chord-color: #ff3366; 
            --secondary-color: #1b263b;
            --text-color: #e0e1dd;
            --text-muted: #778da9;
            --danger: #ff4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* TAB NAVIGATION */
        .tab-container {
            display: flex; width: 100%; max-width: 400px; margin-bottom: 10px;
            background: var(--surface-color); border-radius: 8px; overflow: hidden; border: 1px solid var(--secondary-color);
        }
        .tab-btn {
            flex: 1; padding: 12px; background: transparent; color: var(--text-muted);
            border: none; font-weight: bold; font-size: 1rem; cursor: pointer; transition: all 0.3s;
        }
        .tab-btn.active#tab-licks { background: var(--primary-color); color: #000; }
        .tab-btn.active#tab-chords { background: var(--chord-color); color: #fff; }

        .dashboard {
            background-color: var(--surface-color); padding: 15px; border-radius: 12px;
            width: 100%; max-width: 400px; box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            box-sizing: border-box; border: 1px solid var(--secondary-color);
        }

        .section-title {
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;
            color: var(--primary-color); margin: 12px 0 8px 0; border-bottom: 1px solid var(--secondary-color); padding-bottom: 4px;
        }
        .chords-view .section-title { color: var(--chord-color); }
        .section-title:first-child { margin-top: 0; }

        .control-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.85rem; }
        
        select, input[type="range"] {
            background: #0d1117; color: white; border: 1px solid var(--secondary-color);
            padding: 6px; border-radius: 4px; font-size: 0.85rem; max-width: 55%;
        }
        select { width: 55%; }
        
        .licks-view input[type="range"] { width: 50%; accent-color: var(--primary-color); }
        .chords-view input[type="range"] { width: 50%; accent-color: var(--chord-color); }

        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--secondary-color); transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: var(--text-color); transition: .3s; border-radius: 50%; }
        .chords-view input:checked + .slider { background-color: var(--chord-color); }
        input:checked + .slider:before { transform: translateX(22px); background-color: #fff;}

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        
        button.action-btn {
            background-color: transparent; color: var(--text-color); border: 1px solid var(--secondary-color);
            padding: 12px 8px; font-size: 0.9rem; font-weight: bold; border-radius: 6px; cursor: pointer;
        }
        
        .licks-view button.primary { background: var(--primary-color); color: #000; border: none; font-size: 1.1rem; padding: 14px; box-shadow: 0 0 10px rgba(0,255,204,0.2);}
        .chords-view button.primary { background: var(--chord-color); color: #fff; border: none; font-size: 1.1rem; padding: 14px; box-shadow: 0 0 10px rgba(255,51,102,0.2);}
        
        .global-stop { background: var(--danger) !important; color: white !important; grid-column: span 2; display: none; border: none !important;}

        button:active { transform: scale(0.96); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .reveal-area {
            margin-top: 15px; background: #000; border: 1px solid var(--secondary-color);
            border-radius: 6px; padding: 10px; text-align: center; overflow-x: auto; min-height: 80px;
        }
        
        .reveal-hint { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;}
        .licks-view .reveal-content { font-size: 1.1rem; color: var(--primary-color); font-weight: bold; min-height: 30px;}
        .chords-view .reveal-content { font-size: 1.2rem; color: var(--chord-color); font-weight: bold; min-height: 30px; letter-spacing: 1px;}
        
        .active-params { font-size: 0.8rem; color: #a9a9a9; margin-top: 10px; border-top: 1px dashed #333; padding-top: 8px; line-height: 1.4;}
    </style>
</head>
<body>

    <div class="tab-container">
        <button class="tab-btn active" id="tab-licks">Lick Engine</button>
        <button class="tab-btn" id="tab-chords">Chord Engine</button>
    </div>

    <div class="dashboard licks-view" id="view-licks">
        
        <div class="section-title">Tonal Center</div>
        <div class="control-group">
            <label>Key</label>
            <select id="lick-key">
                <option value="random">🎲 Random Key</option>
                <option value="C">C</option><option value="G">G</option><option value="D">D</option>
                <option value="A" selected>A</option><option value="E">E</option>
            </select>
        </div>
        <div class="control-group">
            <label>Scale</label>
            <select id="lick-scale">
                <option value="majPent">Major Pentatonic</option>
                <option value="minPent">Minor Pentatonic</option>
                <option value="blues" selected>Blues Scale</option>
                <option value="dorian">Dorian</option>
            </select>
        </div>

        <div class="section-title">Phrasing & Feel</div>
        <div class="control-group">
            <label>Genre Rhythm</label>
            <select id="lick-genre">
                <option value="rock" selected>Rock (Driving)</option>
                <option value="blues">Blues (Triplets)</option>
                <option value="jazz">Jazz (Syncopated)</option>
            </select>
        </div>
        <div class="control-group">
            <label>Arpeggio Bias: <span id="lick-arp-disp">30%</span></label>
            <input type="range" id="lick-arp" min="0" max="100" step="10" value="30">
        </div>
        <div class="control-group">
            <label>Length (Notes): <span id="lick-diff-disp">8</span></label>
            <input type="range" id="lick-diff" min="4" max="16" value="8">
        </div>

        <div class="section-title">Playback</div>
        <div class="control-group">
            <label>Speed: <span id="lick-speed-disp">100%</span></label>
            <input type="range" id="lick-speed" min="50" max="150" step="5" value="100">
        </div>

        <div class="btn-grid">
            <button id="lick-gen-btn" class="action-btn primary" style="grid-column: span 2;">Generate & Play Lick</button>
            <button id="lick-replay-btn" class="action-btn">Replay Audio</button>
            <button id="lick-reveal-btn" class="action-btn" style="border-color: var(--primary-color); color: var(--primary-color);">Reveal Notes</button>
            <button id="global-stop-lick" class="action-btn global-stop">🛑 HARD STOP AUDIO</button>
        </div>
        
        <div class="reveal-area">
            <div class="reveal-hint" id="lick-hint">Status</div>
            <div class="reveal-content" id="lick-text">Ready</div>
        </div>
    </div>

    <div class="dashboard chords-view" id="view-chords" style="display: none;">
        
        <div class="section-title">Harmony Parameters</div>
        <div class="control-group">
            <label>Key Center</label>
            <select id="chord-key">
                <option value="random">🎲 Random Key</option>
                <option value="C" selected>C</option><option value="G">G</option><option value="D">D</option>
                <option value="A">A</option><option value="E">E</option>
            </select>
        </div>
        <div class="control-group">
            <label>Progression Style</label>
            <select id="chord-style">
                <option value="basic" selected>Basic (Campfire / Pop)</option>
                <option value="jazz">Standard (Jazz / R&B)</option>
                <option value="modal">Modal Mixture (Out There)</option>
                <option value="alien">Alien (Atonal / Random)</option>
            </select>
        </div>
        <div class="control-group">
            <label>Spice (Extensions): <span id="chord-spice-disp">0%</span></label>
            <input type="range" id="chord-spice" min="0" max="100" step="50" value="0">
        </div>
        <div class="control-group">
            <label>Length (Bars)</label>
            <select id="chord-length">
                <option value="4" selected>4 Bars</option>
                <option value="8">8 Bars</option>
            </select>
        </div>

        <div class="section-title">Rhythm & Loop</div>
        <div class="control-group">
            <label>Feel</label>
            <select id="chord-rhythm">
                <option value="whole" selected>Whole Notes (Pads)</option>
                <option value="quarter">Quarter Notes (Strum)</option>
                <option value="syncopated">Syncopated (Comping)</option>
            </select>
        </div>
        <div class="control-group">
            <label>Speed (BPM): <span id="chord-speed-disp">90</span></label>
            <input type="range" id="chord-speed" min="60" max="160" step="5" value="90">
        </div>
        <div class="control-group">
            <label>Infinite Loop</label>
            <label class="switch">
                <input type="checkbox" id="chord-loop" checked>
                <span class="slider"></span>
            </label>
        </div>

        <div class="btn-grid">
            <button id="chord-gen-btn" class="action-btn primary" style="grid-column: span 2;">Generate & Play Chords</button>
            <button id="global-stop-chord" class="action-btn global-stop">🛑 STOP LOOP</button>
        </div>
        
        <div class="reveal-area">
            <div class="reveal-hint">Progression</div>
            <div class="reveal-content" id="chord-roman">---</div>
            <div class="active-params" id="chord-names">---</div>
        </div>
    </div>


    <script>
        // --- UI TAB LOGIC ---
        const tabLicks = document.getElementById('tab-licks');
        const tabChords = document.getElementById('tab-chords');
        const viewLicks = document.getElementById('view-licks');
        const viewChords = document.getElementById('view-chords');

        tabLicks.addEventListener('click', () => {
            tabLicks.classList.add('active'); tabChords.classList.remove('active');
            viewLicks.style.display = 'block'; viewChords.style.display = 'none';
        });
        tabChords.addEventListener('click', () => {
            tabChords.classList.add('active'); tabLicks.classList.remove('active');
            viewChords.style.display = 'block'; viewLicks.style.display = 'none';
        });

        // --- GLOBAL AUDIO ENGINE (HARDENED) ---
        const roomReverb = new Tone.Reverb({ decay: 2.5, wet: 0.3 }).toDestination();
        
        const leadSynth = new Tone.Synth({
            oscillator: { type: "triangle" }, envelope: { attack: 0.01, decay: 0.4, sustain: 0.1, release: 0.8 }
        }).connect(roomReverb);
        
        const compSynth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sine" }, envelope: { attack: 0.05, decay: 0.2, sustain: 0.8, release: 1.5 },
            maxPolyphony: 6
        }).connect(roomReverb);
        compSynth.volume.value = -12;

        let isLooping = false;

        // The Ultimate Audio Reset Function
        async function resetAudioEngine() {
            isLooping = false;
            Tone.Transport.stop();
            Tone.Transport.cancel(0); // Wipes all scheduled events
            Tone.Transport.position = 0; // Resets the internal clock
            
            leadSynth.releaseAll();
            compSynth.releaseAll();

            // Wake up the browser context if it went to sleep
            if (Tone.context.state !== 'running') {
                await Tone.start();
            }

            document.getElementById('global-stop-lick').style.display = 'none';
            document.getElementById('global-stop-chord').style.display = 'none';
            document.getElementById('lick-gen-btn').disabled = false;
            document.getElementById('lick-replay-btn').disabled = false;
            document.getElementById('chord-gen-btn').disabled = false;
        }

        document.getElementById('global-stop-lick').addEventListener('click', resetAudioEngine);
        document.getElementById('global-stop-chord').addEventListener('click', resetAudioEngine);

        function resolveParam(val, optionsArray) { return val !== "random" ? val : optionsArray[Math.floor(Math.random() * optionsArray.length)]; }

        // ==========================================
        //         LICK GENERATOR LOGIC
        // ==========================================
        const scales = {
            majPent: { intervals:[0,2,4,7,9, 12,14,16,19,21], names:["1","2","3","5","6"] },
            minPent: { intervals:[0,3,5,7,10, 12,15,17,19,22], names:["1","b3","4","5","b7"] },
            blues:   { intervals:[0,3,5,6,7,10, 12,15,17,18,19,22], names:["1","b3","4","b5","5","b7"] },
            dorian:  { intervals:[0,2,3,5,7,9,10, 12,14,15,17,19,21,22], names:["1","2","b3","4","5","6","b7"] }
        };

        const lickUI = {
            key: document.getElementById('lick-key'), scale: document.getElementById('lick-scale'),
            genre: document.getElementById('lick-genre'), arp: document.getElementById('lick-arp'), 
            diff: document.getElementById('lick-diff'), speed: document.getElementById('lick-speed')
        };

        document.getElementById('lick-diff').addEventListener('input', e => document.getElementById('lick-diff-disp').textContent = e.target.value);
        document.getElementById('lick-arp').addEventListener('input', e => document.getElementById('lick-arp-disp').textContent = e.target.value + '%');
        document.getElementById('lick-speed').addEventListener('input', e => document.getElementById('lick-speed-disp').textContent = e.target.value + '%');

        let currentLick = []; let lickRevealStage = 0; let lickBPM = 100;

        function generateLick() {
            currentLick = [];
            const key = resolveParam(lickUI.key.value, ["C","G","D","A","E"]);
            const scaleData = scales[resolveParam(lickUI.scale.value, Object.keys(scales))];
            const maxNotes = parseInt(lickUI.diff.value); 
            
            const rootFreq = Tone.Frequency(key + "3");
            let currentIndex = Math.floor(scaleData.intervals.length / 2); 

            for (let i = 0; i < maxNotes; i++) {
                let duration = lickUI.genre.value === "blues" ? "8t" : "8n"; 
                if (i === maxNotes - 1) duration = "2n"; 

                if (i > 0) {
                    currentIndex += (Math.random() > 0.5 ? 1 : -1) * (Math.random() > 0.8 ? 2 : 1);
                    currentIndex = Math.max(0, Math.min(currentIndex, scaleData.intervals.length - 1));
                }

                const actualMidi = rootFreq.transpose(scaleData.intervals[currentIndex]).toMidi();
                currentLick.push({ 
                    note: Tone.Frequency(actualMidi, "midi").toNote(),
                    degree: scaleData.names[currentIndex], dur: duration
                });
            }
            lickBPM = 110; lickRevealStage = 0; updateLickRevealUI();
        }

        async function playLick() {
            if (currentLick.length === 0) return;
            await resetAudioEngine(); // Flushes buffer before starting
            
            document.getElementById('lick-gen-btn').disabled = true;
            document.getElementById('lick-replay-btn').disabled = true;
            document.getElementById('global-stop-lick').style.display = 'block';

            Tone.Transport.bpm.value = lickBPM * (parseInt(lickUI.speed.value) / 100); 
            Tone.Transport.start();

            const now = Tone.now() + 0.1;
            let timeOffset = 0;
            currentLick.forEach((data) => {
                const beatSecs = Tone.Time(data.dur).toSeconds();
                Tone.Transport.scheduleOnce((time) => {
                    leadSynth.triggerAttackRelease(data.note, data.dur, time, 0.8);
                }, "+" + timeOffset);
                timeOffset += beatSecs;
            });

            Tone.Transport.scheduleOnce(() => { resetAudioEngine(); }, "+" + (timeOffset + 0.5));
        }

        function updateLickRevealUI() {
            const rt = document.getElementById('lick-text'); const rh = document.getElementById('lick-hint');
            if (currentLick.length === 0) { rt.textContent = "???"; return; }
            if (lickRevealStage === 0) { rh.textContent = "Hidden"; rt.textContent = "???"; document.getElementById('lick-reveal-btn').textContent = "Reveal Intervals"; } 
            else if (lickRevealStage === 1) { rh.textContent = "Scale Degrees"; rt.textContent = currentLick.map(d => d.degree).join(' - '); document.getElementById('lick-reveal-btn').textContent = "Reveal Exact Notes"; } 
            else { rh.textContent = "Exact Notes"; rt.textContent = currentLick.map(d => d.note.replace(/[0-9]/g, '')).join(' - '); document.getElementById('lick-reveal-btn').textContent = "Hide All"; }
        }

        document.getElementById('lick-reveal-btn').addEventListener('click', () => { lickRevealStage = lickRevealStage >= 2 ? 0 : lickRevealStage + 1; updateLickRevealUI(); });
        document.getElementById('lick-gen-btn').addEventListener('click', async () => { generateLick(); await playLick(); });
        document.getElementById('lick-replay-btn').addEventListener('click', async () => await playLick());


        // ==========================================
        //   CHORD PROGRESSION ENGINE (OUT THERE)
        // ==========================================
        const chordUI = {
            key: document.getElementById('chord-key'), style: document.getElementById('chord-style'),
            length: document.getElementById('chord-length'), spice: document.getElementById('chord-spice'),
            rhythm: document.getElementById('chord-rhythm'), speed: document.getElementById('chord-speed'),
            loop: document.getElementById('chord-loop')
        };

        document.getElementById('chord-spice').addEventListener('input', e => {
            let val = parseInt(e.target.value);
            document.getElementById('chord-spice-disp').textContent = val === 0 ? "Triads" : (val === 50 ? "7ths" : "Extended/Altered");
        });
        document.getElementById('chord-speed').addEventListener('input', e => document.getElementById('chord-speed-disp').textContent = e.target.value);

        let currentProgression = [];

        function getVoicing(rootMidi, quality, spiceLvl) {
            let notes = [rootMidi];
            if (quality === 'maj') notes.push(rootMidi+4, rootMidi+7);
            else if (quality === 'min') notes.push(rootMidi+3, rootMidi+7);
            else if (quality === 'dim') notes.push(rootMidi+3, rootMidi+6);
            else if (quality === 'dom') notes.push(rootMidi+4, rootMidi+7);
            else if (quality === 'aug') notes.push(rootMidi+4, rootMidi+8);

            // Spice = 50 (7ths)
            if (spiceLvl >= 50) {
                if (quality === 'maj') notes.push(rootMidi+11);
                else if (quality === 'min') notes.push(rootMidi+10);
                else if (quality === 'dim') notes.push(rootMidi+9); 
                else if (quality === 'dom') notes.push(rootMidi+10);
                else if (quality === 'aug') notes.push(rootMidi+10); 
            }

            // Spice = 100 (9ths / 13ths)
            if (spiceLvl >= 100) {
                if (quality === 'maj') notes.push(rootMidi+14); // 9
                else if (quality === 'min') notes.push(rootMidi+14); // 9
                else if (quality === 'dom') notes.push(rootMidi+14, rootMidi+21); // 9 and 13
            }
            return notes.map(m => Tone.Frequency(m, "midi").toNote());
        }

        // Logic sets for the different styles
        const paths = {
            basic: [ // Diatonic Major Triads
                [{r:0, q:'maj', n:"I"}, {r:5, q:'maj', n:"IV"}, {r:7, q:'dom', n:"V"}, {r:0, q:'maj', n:"I"}],
                [{r:0, q:'maj', n:"I"}, {r:9, q:'min', n:"vi"}, {r:5, q:'maj', n:"IV"}, {r:7, q:'dom', n:"V"}],
                [{r:9, q:'min', n:"vi"}, {r:5, q:'maj', n:"IV"}, {r:0, q:'maj', n:"I"}, {r:7, q:'dom', n:"V"}]
            ],
            jazz: [ // ii-V-I's and secondary dominants
                [{r:2, q:'min', n:"ii"}, {r:7, q:'dom', n:"V"}, {r:0, q:'maj', n:"I"}, {r:9, q:'min', n:"vi"}],
                [{r:4, q:'min', n:"iii"}, {r:9, q:'min', n:"vi"}, {r:2, q:'min', n:"ii"}, {r:7, q:'dom', n:"V"}],
                [{r:0, q:'maj', n:"I"}, {r:9, q:'dom', n:"VI7"}, {r:2, q:'min', n:"ii"}, {r:7, q:'dom', n:"V"}]
            ],
            modal: [ // Borrowing from the parallel minor
                [{r:0, q:'maj', n:"I"}, {r:3, q:'maj', n:"bIII"}, {r:5, q:'min', n:"iv"}, {r:8, q:'maj', n:"bVI"}],
                [{r:0, q:'maj', n:"I"}, {r:5, q:'min', n:"iv"}, {r:0, q:'maj', n:"I"}, {r:10, q:'maj', n:"bVII"}],
                [{r:9, q:'min', n:"vi"}, {r:8, q:'maj', n:"bVI"}, {r:7, q:'dom', n:"V"}, {r:4, q:'dom', n:"III7"}]
            ]
        };

        function generateProgression() {
            currentProgression = [];
            const key = resolveParam(chordUI.key.value, ["C","G","D","A","E"]);
            const style = chordUI.style.value;
            const length = parseInt(chordUI.length.value);
            const spice = parseInt(chordUI.spice.value);
            
            const rootMidi = Tone.Frequency(key + "3").toMidi();

            if (style === "alien") {
                // Completely random atonal progression
                const qualities = ['maj', 'min', 'dom', 'dim', 'aug'];
                for(let i=0; i<length; i++) {
                    let randInterval = Math.floor(Math.random() * 12);
                    let randQual = qualities[Math.floor(Math.random() * qualities.length)];
                    let rootM = rootMidi + randInterval;
                    let chordName = Tone.Frequency(rootM, "midi").toNote().replace(/[0-9]/g, '') + (randQual === 'min' ? 'm' : (randQual === 'dom' ? '7' : (randQual==='dim'? 'dim' : (randQual==='aug'?'aug': (spice>=50?'maj7':'')))));
                    
                    currentProgression.push({ roman: "?", name: chordName, notes: getVoicing(rootM, randQual, spice) });
                }
            } else {
                // Structured paths
                let pathList = paths[style];
                let selectedPath = pathList[Math.floor(Math.random() * pathList.length)];
                
                if (length === 8) {
                    let path2 = pathList[Math.floor(Math.random() * pathList.length)];
                    selectedPath = selectedPath.concat(path2);
                }

                selectedPath.forEach(chord => {
                    let rootM = rootMidi + chord.r;
                    let chordName = Tone.Frequency(rootM, "midi").toNote().replace(/[0-9]/g, '') + (chord.q === 'min' ? 'm' : (chord.q === 'dom' ? '7' : (spice>=50&&chord.q==='maj'?'maj7':'')));
                    currentProgression.push({ roman: chord.n, name: chordName, notes: getVoicing(rootM, chord.q, spice) });
                });
            }

            document.getElementById('chord-roman').textContent = currentProgression.map(c => c.roman).join(" - ");
            document.getElementById('chord-names').textContent = currentProgression.map(c => c.name).join("  |  ");
        }

        async function playChords() {
            if (currentProgression.length === 0) return;
            await resetAudioEngine(); // Flush the engine before playing
            
            isLooping = true;
            document.getElementById('chord-gen-btn').disabled = true;
            document.getElementById('global-stop-chord').style.display = 'block';
            
            Tone.Transport.bpm.value = parseInt(chordUI.speed.value);
            const rhythm = chordUI.rhythm.value;
            const loopEnd = currentProgression.length + "m";

            Tone.Transport.scheduleRepeat((time) => {
                if (!isLooping) return;
                
                currentProgression.forEach((chord, index) => {
                    let startTime = index + "m";
                    
                    if (rhythm === "whole") {
                        compSynth.triggerAttackRelease(chord.notes, "1m", time + Tone.Time(startTime).toSeconds());
                    } else if (rhythm === "quarter") {
                        for(let i=0; i<4; i++) compSynth.triggerAttackRelease(chord.notes, "8n", time + Tone.Time(startTime).toSeconds() + Tone.Time(i + "n").toSeconds(), 0.7);
                    } else if (rhythm === "syncopated") {
                        compSynth.triggerAttackRelease(chord.notes, "8n", time + Tone.Time(startTime).toSeconds());
                        compSynth.triggerAttackRelease(chord.notes, "4n", time + Tone.Time(startTime).toSeconds() + Tone.Time("4n.").toSeconds(), 0.6);
                    }
                });
            }, loopEnd);

            Tone.Transport.start();

            // Auto-stop if loop toggle is off
            if (!chordUI.loop.checked) {
                let totalSecs = (60 / parseInt(chordUI.speed.value)) * 4 * currentProgression.length;
                setTimeout(() => { if(!chordUI.loop.checked) resetAudioEngine(); }, totalSecs * 1000 + 500);
            }
        }

        document.getElementById('chord-gen-btn').addEventListener('click', async () => { generateProgression(); await playChords(); });
        chordUI.loop.addEventListener('change', (e) => { if (!e.target.checked) resetAudioEngine(); });

    </script>
</body>
</html>
